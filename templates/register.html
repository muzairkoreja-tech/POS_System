<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - POS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px 10px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .register-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 460px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .register-header {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .register-header i {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .register-header h2 {
            font-size: 22px;
            font-weight: 600;
        }
        .register-header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .register-body {
            padding: 30px;
        }
        .register-body .form-group {
            margin-bottom: 16px;
        }
        .register-body .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .register-body .input-wrapper {
            position: relative;
        }
        .register-body .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .register-body .input-wrapper input,
        .register-body .input-wrapper select {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            appearance: auto;
        }
        .register-body .input-wrapper select {
            padding-left: 42px;
        }
        .register-body .input-wrapper input:focus,
        .register-body .input-wrapper select:focus {
            outline: none;
            border-color: #43e97b;
        }
        .register-body .error-msg {
            background: #fee;
            color: #c0392b;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .register-body .error-msg.show {
            display: block;
        }
        .register-body .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .register-body .success-msg.show {
            display: block;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-register:hover { opacity: 0.9; }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }
        .register-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .register-footer a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .register-footer a:hover { text-decoration: underline; }
        .register-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <i class="fas fa-user-plus"></i>
            <h2>Create Account</h2>
            <p>Register a new user for the POS System</p>
        </div>
        <div class="register-body">
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            <form id="registerForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Username *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="fullName" placeholder="Full name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Role *</label>
                        <div class="input-wrapper">
                            <i class="fas fa-shield-alt"></i>
                            <select id="role" required>
                                <option value="">Select Role</option>
                                <option value="admin">Admin</option>
                                <option value="procurement_manager">Procurement Manager</option>
                                <option value="sales_person">Sales Person</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter email address">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter a strong password" required autocomplete="new-password">
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn-register" id="registerBtn" onclick="handleRegister()">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            <div class="register-footer">
                <a onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleRegister() {
            const btn = document.getElementById('registerBtn');
            const username = document.getElementById('username').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            if (!username || !fullName || !role || !password) {
                errorMsg.textContent = 'Please fill in all required fields';
                errorMsg.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters long';
                errorMsg.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="register-spinner"></span> Creating Account...';

            fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, full_name: fullName, role, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    successMsg.innerHTML = '<i class="fas fa-check-circle"></i> Account created successfully! Redirecting to login...';
                    successMsg.classList.add('show');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            })
            .catch(err => {
                errorMsg.textContent = 'Registration failed. Please try again.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            });
        }

        function goBack() {
            window.location.href = '/login';
        }

        document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>
</html>
