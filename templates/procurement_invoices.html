<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Invoices - POS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:#f0f2f8;color:#2d3436;min-height:100vh;}

        .topbar{background:linear-gradient(135deg,#8e44ad,#9b59b6);color:#fff;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25);position:sticky;top:0;z-index:200;}
        .topbar-left{display:flex;align-items:center;gap:14px;}
        .topbar-left h1{font-size:17px;font-weight:700;}
        .topbar-right{display:flex;gap:10px;align-items:center;}
        .btn{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .2s,transform .15s;white-space:nowrap;}
        .btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
        .btn:disabled{opacity:.55;cursor:not-allowed;}
        .btn-primary{background:#667eea;color:#fff;}
        .btn-success{background:#27ae60;color:#fff;}
        .btn-danger{background:#e74c3c;color:#fff;}
        .btn-secondary{background:#636e72;color:#fff;}
        .btn-purple{background:#8e44ad;color:#fff;}
        .btn-sm{padding:5px 12px;font-size:12px;}
        .btn-white{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);}
        .btn-white:hover{background:rgba(255,255,255,.28);}

        .stats-bar{background:#fff;border-bottom:1px solid #e8e8e8;padding:10px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
        .stat-pill{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:all .2s;}
        .stat-pill.all{background:#f0f2f8;color:#636e72;border-color:#dde0e8;}
        .stat-pill.all.active,.stat-pill.all:hover{background:#8e44ad;color:#fff;border-color:#8e44ad;}
        .stat-pill.pending{background:#fff8e1;color:#f57c00;border-color:#ffca28;}
        .stat-pill.pending.active,.stat-pill.pending:hover{background:#f39c12;color:#fff;border-color:#f39c12;}
        .stat-pill.partial{background:#e3f2fd;color:#1565c0;border-color:#90caf9;}
        .stat-pill.partial.active,.stat-pill.partial:hover{background:#1565c0;color:#fff;border-color:#1565c0;}
        .stat-pill.paid{background:#e8f5e9;color:#1b5e20;border-color:#66bb6a;}
        .stat-pill.paid.active,.stat-pill.paid:hover{background:#27ae60;color:#fff;border-color:#27ae60;}
        .stat-pill.cancelled{background:#eceff1;color:#546e7a;border-color:#b0bec5;}
        .stat-pill.cancelled.active,.stat-pill.cancelled:hover{background:#546e7a;color:#fff;border-color:#546e7a;}
        .stat-count{background:rgba(0,0,0,.12);border-radius:10px;padding:1px 7px;margin-left:4px;font-size:11px;}

        .main{max-width:1320px;margin:0 auto;padding:20px;}
        .filter-bar{background:#fff;border-radius:10px;padding:12px 16px;display:flex;gap:10px;align-items:center;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
        .filter-bar input{flex:1;padding:8px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;}
        .filter-bar input:focus{border-color:#8e44ad;}

        .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
        .card-header{padding:14px 18px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;}
        .card-header h3{font-size:14px;font-weight:700;color:#2d3436;}
        table{width:100%;border-collapse:collapse;font-size:13px;}
        th{background:#f8f9fa;padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:#636e72;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #eee;white-space:nowrap;}
        td{padding:11px 14px;border-bottom:1px solid #f5f5f5;vertical-align:middle;}
        tr:last-child td{border-bottom:none;}
        tbody tr:hover td{background:#fdf5ff;}

        .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
        .badge-pending{background:#fff3cd;color:#856404;}
        .badge-partially_paid{background:#dbeafe;color:#1d4ed8;}
        .badge-paid{background:#d1fae5;color:#065f46;}
        .badge-cancelled{background:#eceff1;color:#546e7a;}

        .empty-state{text-align:center;padding:60px 20px;color:#aaa;}
        .empty-state i{font-size:52px;margin-bottom:14px;display:block;opacity:.35;}
        .empty-state p{font-size:14px;}

        /* Progress bar in table */
        .mini-progress{height:5px;background:#eee;border-radius:3px;margin-top:4px;overflow:hidden;}
        .mini-progress-fill{height:100%;background:#8e44ad;border-radius:3px;transition:width .4s;}

        /* ══ Create Invoice Modal ══ */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(30,30,60,.55);z-index:900;align-items:center;justify-content:center;padding:20px;}
        .modal{display:block;background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .22s ease;}
        @keyframes popIn{from{transform:scale(.96) translateY(12px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
        .modal-header{padding:18px 22px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:5;}
        .modal-header h4{font-size:16px;font-weight:700;}
        .modal-body{padding:22px;}
        .modal-footer{padding:14px 22px;border-top:1px solid #eee;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;z-index:5;}
        .m-close{background:none;border:none;font-size:22px;cursor:pointer;color:#999;line-height:1;}
        .m-close:hover{color:#333;}

        /* View invoice modal — wider */
        .modal.wide{max-width:780px;}

        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:11px;font-weight:700;color:#636e72;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;font-family:inherit;}
        .form-group input:focus,.form-group select:focus{border-color:#8e44ad;box-shadow:0 0 0 3px rgba(142,68,173,.1);}

        .amount-summary{background:#f8f9fa;border-radius:10px;padding:14px 16px;margin:14px 0;}
        .amount-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:#636e72;}
        .amount-row.total{border-top:2px solid #e0e0e0;margin-top:6px;padding-top:10px;font-size:15px;font-weight:800;color:#2d3436;}
        .amount-row.due{color:#e74c3c;font-weight:700;}

        .gr-info-card{background:#f3e5f5;border-left:4px solid #8e44ad;border-radius:0 8px 8px 0;padding:12px 14px;font-size:13px;color:#4a148c;margin-bottom:14px;}

        .progress-bar-wrap{background:#eee;border-radius:6px;height:8px;overflow:hidden;margin-top:10px;}
        .progress-bar{height:100%;background:linear-gradient(90deg,#8e44ad,#9b59b6);border-radius:6px;transition:width .4s;}

        .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
        .dg-item .lbl{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.4px;}
        .dg-item .val{font-size:14px;font-weight:600;color:#2d3436;margin-top:3px;}

        .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px;}
        .alert-info{background:#e8f4fd;border-left:4px solid #3498db;color:#1565c0;}
        .alert-danger{background:#fff0f0;border-left:4px solid #e74c3c;color:#c0392b;}
        .alert-success{background:#eafaf1;border-left:4px solid #27ae60;color:#1e8449;}
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <button class="btn btn-white btn-sm" onclick="window.location.href='/procurement-dashboard'"><i class="fas fa-arrow-left"></i></button>
        <h1><i class="fas fa-file-invoice-dollar" style="margin-right:6px;opacity:.85;"></i>Vendor Invoices</h1>
    </div>
    <div class="topbar-right">
        <button class="btn btn-white btn-sm" onclick="window.location.href='/procurement/gr'"><i class="fas fa-truck"></i> GRs</button>
        <button class="btn btn-white" onclick="loadInvoices()"><i class="fas fa-sync"></i> Refresh</button>
        <button class="btn btn-white" onclick="openCreate()"><i class="fas fa-plus"></i> New Invoice</button>
    </div>
</div>

<div class="stats-bar">
    <span class="stat-pill all active" onclick="filterStatus('',this)">All <span class="stat-count" id="cnt-all">0</span></span>
    <span class="stat-pill pending" onclick="filterStatus('pending',this)">Pending <span class="stat-count" id="cnt-pending">0</span></span>
    <span class="stat-pill partial" onclick="filterStatus('partially_paid',this)">Partial Paid <span class="stat-count" id="cnt-partial">0</span></span>
    <span class="stat-pill paid" onclick="filterStatus('paid',this)">Paid <span class="stat-count" id="cnt-paid">0</span></span>
    <span class="stat-pill cancelled" onclick="filterStatus('cancelled',this)">Cancelled <span class="stat-count" id="cnt-cancelled">0</span></span>
</div>

<div class="main">
    <div class="filter-bar">
        <i class="fas fa-search" style="color:#aaa;"></i>
        <input type="text" id="invSearch" placeholder="Search by invoice number or vendor…" oninput="filterTable()">
        <button class="btn btn-purple btn-sm" onclick="openCreate()"><i class="fas fa-plus"></i> New Invoice</button>
    </div>
    <div class="card">
        <div class="card-header">
            <h3 id="tableTitle">All Vendor Invoices</h3>
            <span style="font-size:12px;color:#999;" id="tableCount"></span>
        </div>
        <div id="invTableWrap">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div>
        </div>
    </div>
</div>


<!-- ══ CREATE INVOICE MODAL ══ -->
<div class="modal-overlay" id="createOverlay">
    <div class="modal">
        <div class="modal-header">
            <h4><i class="fas fa-file-invoice-dollar" style="color:#8e44ad;margin-right:8px;"></i>New Vendor Invoice</h4>
            <button class="m-close" onclick="closeCreate()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="createAlert"></div>
            <div class="form-group">
                <label>Link to Confirmed GR *</label>
                <select id="invLinkedGR" onchange="loadGRInfo()">
                    <option value="">— Select GR —</option>
                </select>
            </div>
            <div id="grInfoCard" style="display:none;"></div>
            <div class="form-row">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Vendor Invoice No.</label>
                    <input type="text" id="invVendorNo" placeholder="Vendor's invoice number">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Invoice Date</label>
                    <input type="date" id="invDate">
                </div>
            </div>
            <div class="form-row" style="margin-top:14px;">
                <div class="form-group" style="margin-bottom:0;">
                    <label>Due Date</label>
                    <input type="date" id="invDueDate">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label>Notes</label>
                    <input type="text" id="invNotes" placeholder="Optional">
                </div>
            </div>
            <div class="amount-summary" style="margin-top:14px;">
                <div class="form-row" style="margin-bottom:0;gap:10px;">
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:#636e72;text-transform:uppercase;margin-bottom:5px;">Invoice Amount (excl. tax) *</label>
                        <input type="number" id="invAmount" placeholder="0.00" min="0" step="0.01" oninput="calcTotal()" style="width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;">
                    </div>
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;color:#636e72;text-transform:uppercase;margin-bottom:5px;">Tax Amount</label>
                        <input type="number" id="invTax" placeholder="0.00" min="0" step="0.01" value="0" oninput="calcTotal()" style="width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;">
                    </div>
                </div>
                <div style="margin-top:12px;border-top:1px solid #e0e0e0;padding-top:10px;">
                    <div class="amount-row"><span>Invoice Amount</span><span id="summAmt">PKR 0.00</span></div>
                    <div class="amount-row"><span>Tax</span><span id="summTax">PKR 0.00</span></div>
                    <div class="amount-row total"><span>Total Due</span><span id="summTotal" style="color:#8e44ad;">PKR 0.00</span></div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCreate()">Cancel</button>
            <button class="btn btn-purple" id="saveInvBtn" onclick="saveInvoice()"><i class="fas fa-save"></i> Create Invoice</button>
        </div>
    </div>
</div>


<!-- ══ VIEW INVOICE MODAL ══ -->
<div class="modal-overlay" id="viewOverlay">
    <div class="modal wide">
        <div class="modal-header">
            <h4 id="viewTitle">Invoice Details</h4>
            <button class="m-close" onclick="closeView()">&times;</button>
        </div>
        <div class="modal-body" id="viewBody"></div>
        <div class="modal-footer" id="viewFooter"></div>
    </div>
</div>


<script>
const $ = id => document.getElementById(id);
const fmt = n => 'PKR ' + Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

let allInvoices = [];
let currentFilter = '';
let currentInvId = null;

function statusBadge(s) {
    const map = { pending:'badge-pending', partially_paid:'badge-partially_paid', paid:'badge-paid', cancelled:'badge-cancelled' };
    const labels = { pending:'Pending', partially_paid:'Partial Paid', paid:'Paid', cancelled:'Cancelled' };
    return `<span class="badge ${map[s]||'badge-pending'}">${labels[s]||s}</span>`;
}

async function loadInvoices() {
    $('invTableWrap').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading…</p></div>';
    try {
        const data = await fetch('/api/procurement/invoices').then(r=>r.json());
        allInvoices = data;
        $('cnt-all').textContent      = data.length;
        $('cnt-pending').textContent  = data.filter(i=>i.status==='pending').length;
        $('cnt-partial').textContent  = data.filter(i=>i.status==='partially_paid').length;
        $('cnt-paid').textContent     = data.filter(i=>i.status==='paid').length;
        $('cnt-cancelled').textContent= data.filter(i=>i.status==='cancelled').length;
        renderTable(data);
    } catch(e) {
        $('invTableWrap').innerHTML = '<div class="empty-state" style="color:#e74c3c;"><i class="fas fa-exclamation-circle"></i><p>Failed to load.</p></div>';
    }
}

function renderTable(data) {
    if (!data.length) {
        $('invTableWrap').innerHTML = '<div class="empty-state"><i class="fas fa-file-invoice-dollar"></i><p>No invoices found</p></div>';
        $('tableCount').textContent = '';
        return;
    }
    $('tableCount').textContent = `${data.length} record(s)`;
    const rows = data.map(inv => {
        const pct = inv.total_amount>0 ? Math.min(100,(inv.amount_paid||0)/inv.total_amount*100) : 0;
        return `<tr>
            <td><strong style="color:#8e44ad;">${inv.doc_number||'—'}</strong></td>
            <td>${inv.vendor_invoice_no||'—'}</td>
            <td>${inv.vendor_name||'—'}</td>
            <td><strong>${fmt(inv.total_amount)}</strong></td>
            <td style="color:#27ae60;font-weight:700;">${fmt(inv.amount_paid)}</td>
            <td style="color:#e74c3c;font-weight:700;">${fmt(inv.amount_due)}</td>
            <td>
                ${statusBadge(inv.status||'pending')}
                <div class="mini-progress"><div class="mini-progress-fill" style="width:${pct.toFixed(0)}%"></div></div>
            </td>
            <td style="color:#636e72;">${inv.due_date||'—'}</td>
            <td><button class="btn btn-primary btn-sm" onclick="viewInvoice('${inv._id}')"><i class="fas fa-eye"></i> View</button></td>
        </tr>`;
    }).join('');
    $('invTableWrap').innerHTML = `<table>
        <thead><tr><th>Invoice No.</th><th>Vendor Inv.</th><th>Vendor</th><th>Total</th><th>Paid</th><th>Due</th><th>Status / Progress</th><th>Due Date</th><th>Action</th></tr></thead>
        <tbody>${rows}</tbody>
    </table>`;
}

function filterStatus(status, el) {
    currentFilter = status;
    document.querySelectorAll('.stat-pill').forEach(p=>p.classList.remove('active'));
    el.classList.add('active');
    const filtered = status ? allInvoices.filter(i=>i.status===status) : allInvoices;
    $('tableTitle').textContent = status ? status.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) + ' Invoices' : 'All Vendor Invoices';
    $('invSearch').value = '';
    renderTable(filtered);
}

function filterTable() {
    const q = $('invSearch').value.toLowerCase();
    const base = currentFilter ? allInvoices.filter(i=>i.status===currentFilter) : allInvoices;
    renderTable(q ? base.filter(i =>
        (i.doc_number||'').toLowerCase().includes(q) ||
        (i.vendor_name||'').toLowerCase().includes(q) ||
        (i.vendor_invoice_no||'').toLowerCase().includes(q)
    ) : base);
}

/* ── Create Invoice ── */
async function openCreate(grIdParam) {
    $('createAlert').innerHTML = '';
    $('invLinkedGR').innerHTML = '<option value="">— Loading GRs… —</option>';
    $('invVendorNo').value = '';
    $('invDate').value = new Date().toISOString().slice(0,10);
    $('invDueDate').value = '';
    $('invAmount').value = '';
    $('invTax').value = '0';
    $('invNotes').value = '';
    $('grInfoCard').style.display = 'none';
    calcTotal();
    $('createOverlay').style.display = 'flex';

    try {
        const grs = await fetch('/api/procurement/gr?status=confirmed').then(r=>r.json());
        $('invLinkedGR').innerHTML = '<option value="">— Select Confirmed GR —</option>' +
            grs.map(gr => `<option value="${gr._id}">${gr.doc_number} — ${gr.vendor_name||'Unknown'} (${gr.delivery_date||''})</option>`).join('');
        if (grIdParam) { $('invLinkedGR').value = grIdParam; await loadGRInfo(); }
    } catch(e) {
        $('invLinkedGR').innerHTML = '<option value="">— Failed to load GRs —</option>';
    }
}

function closeCreate() { $('createOverlay').style.display = 'none'; }

async function loadGRInfo() {
    const grId = $('invLinkedGR').value;
    $('grInfoCard').style.display = 'none';
    if (!grId) return;
    try {
        const gr = await fetch(`/api/procurement/gr/${grId}`).then(r=>r.json());
        const total = (gr.items||[]).reduce((s,i)=>s+(i.qty_received||0)*(i.unit_price||0),0);
        $('grInfoCard').style.display = 'block';
        $('grInfoCard').innerHTML = `<div class="gr-info-card">
            <strong>${gr.doc_number}</strong> &nbsp;·&nbsp; ${gr.vendor_name||'Unknown'} &nbsp;·&nbsp; Delivery: ${gr.delivery_date||'—'} &nbsp;·&nbsp; GR Value: <strong>${fmt(total)}</strong>
        </div>`;
        if (!$('invAmount').value) { $('invAmount').value = total.toFixed(2); calcTotal(); }
    } catch(e) {}
}

function calcTotal() {
    const amt = parseFloat($('invAmount').value)||0;
    const tax = parseFloat($('invTax').value)||0;
    $('summAmt').textContent = fmt(amt);
    $('summTax').textContent = fmt(tax);
    $('summTotal').textContent = fmt(amt+tax);
}

async function saveInvoice() {
    const grSel = $('invLinkedGR');
    if (!grSel.value) { $('createAlert').innerHTML = '<div class="alert alert-danger">Please select a GR.</div>'; return; }
    const amt = parseFloat($('invAmount').value)||0;
    if (amt <= 0) { $('createAlert').innerHTML = '<div class="alert alert-danger">Invoice amount must be greater than 0.</div>'; return; }

    $('saveInvBtn').disabled = true;
    $('saveInvBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';

    try {
        const d = await fetch('/api/procurement/invoices', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                gr_id: grSel.value,
                gr_number: grSel.options[grSel.selectedIndex].text.split(' — ')[0],
                vendor_invoice_no: $('invVendorNo').value.trim(),
                invoice_date: $('invDate').value,
                due_date: $('invDueDate').value,
                invoice_amount: amt,
                tax_amount: parseFloat($('invTax').value)||0,
                notes: $('invNotes').value.trim()
            })
        }).then(r=>r.json());

        if (d.success) { closeCreate(); await loadInvoices(); }
        else { $('createAlert').innerHTML = `<div class="alert alert-danger">${d.message||'Failed to create invoice'}</div>`; }
    } catch(e) {
        $('createAlert').innerHTML = '<div class="alert alert-danger">Connection error.</div>';
    } finally {
        $('saveInvBtn').disabled = false;
        $('saveInvBtn').innerHTML = '<i class="fas fa-save"></i> Create Invoice';
    }
}

/* ── View Invoice ── */
async function viewInvoice(id) {
    currentInvId = id;
    $('viewBody').innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>';
    $('viewFooter').innerHTML = '';
    $('viewOverlay').style.display = 'flex';
    try {
        const inv = await fetch(`/api/procurement/invoices/${id}`).then(r=>r.json());
        $('viewTitle').textContent = `${inv.doc_number}`;
        const pct = inv.total_amount>0 ? Math.min(100,((inv.amount_paid||0)/inv.total_amount*100)).toFixed(0) : 0;
        $('viewBody').innerHTML = `
            <div class="detail-grid">
                <div class="dg-item"><div class="lbl">Status</div><div class="val">${statusBadge(inv.status)}</div></div>
                <div class="dg-item"><div class="lbl">Vendor</div><div class="val">${inv.vendor_name||'—'}</div></div>
                <div class="dg-item"><div class="lbl">Vendor Invoice #</div><div class="val">${inv.vendor_invoice_no||'—'}</div></div>
                <div class="dg-item"><div class="lbl">Invoice Date</div><div class="val">${inv.invoice_date||'—'}</div></div>
                <div class="dg-item"><div class="lbl">Due Date</div><div class="val">${inv.due_date||'—'}</div></div>
                <div class="dg-item"><div class="lbl">GR Reference</div><div class="val">${inv.gr_number||'—'}</div></div>
            </div>
            <div class="amount-summary">
                <div class="amount-row"><span>Invoice Amount</span><span>${fmt(inv.invoice_amount)}</span></div>
                <div class="amount-row"><span>Tax</span><span>${fmt(inv.tax_amount)}</span></div>
                <div class="amount-row total"><span>Total</span><span>${fmt(inv.total_amount)}</span></div>
                <div style="margin-top:12px;border-top:1px solid #e0e0e0;padding-top:10px;">
                    <div class="amount-row"><span>Amount Paid</span><span style="color:#27ae60;font-weight:700;">${fmt(inv.amount_paid)}</span></div>
                    <div class="amount-row due"><span>Amount Due</span><span>${fmt(inv.amount_due)}</span></div>
                    <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
                    <div style="text-align:right;font-size:11px;color:#999;margin-top:4px;">${pct}% paid</div>
                </div>
            </div>
            ${inv.notes?`<div style="font-size:13px;color:#636e72;margin-top:12px;padding:10px 14px;background:#f8f9fa;border-radius:8px;"><i class="fas fa-sticky-note" style="margin-right:6px;color:#8e44ad;"></i>${inv.notes}</div>`:''}`;

        let btns = `<button class="btn btn-secondary" onclick="closeView()">Close</button>`;
        if (inv.status !== 'paid' && inv.status !== 'cancelled') {
            btns += `<button class="btn btn-success" onclick="window.location.href='/procurement/payments?invoice_id=${inv._id}'"><i class="fas fa-money-bill-wave"></i> Make Payment</button>`;
        }
        if (inv.status === 'pending' && (inv.amount_paid||0) === 0) {
            btns += `<button class="btn btn-danger" onclick="cancelInvoice('${inv._id}')"><i class="fas fa-ban"></i> Cancel</button>`;
        }
        $('viewFooter').innerHTML = btns;
    } catch(e) {
        $('viewBody').innerHTML = '<div class="alert alert-danger">Failed to load invoice details.</div>';
    }
}

function closeView() { $('viewOverlay').style.display = 'none'; }

async function cancelInvoice(id) {
    if (!confirm('Cancel this invoice? This cannot be undone.')) return;
    try {
        const d = await fetch(`/api/procurement/invoices/${id}/cancel`, {method:'POST'}).then(r=>r.json());
        if (d.success) { closeView(); await loadInvoices(); }
        else alert(d.message||'Failed to cancel');
    } catch(e) { alert('Connection error.'); }
}

document.addEventListener('DOMContentLoaded', async () => {
    await loadInvoices();
    const grId = new URLSearchParams(window.location.search).get('gr_id');
    if (grId) openCreate(grId);
});

['createOverlay','viewOverlay'].forEach(id => {
    $(id).addEventListener('click', function(e) {
        if (e.target === this) { id==='createOverlay' ? closeCreate() : closeView(); }
    });
});
</script>
</body>
</html>
