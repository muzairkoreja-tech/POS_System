<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Audit Trail — POS Supermarket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.nav{background:linear-gradient(135deg,#1a1a2e,#2d3748);color:#fff;padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.nav-brand{font-size:18px;font-weight:700;color:#f6ad55;margin-right:8px}
.nav-sub{font-size:13px;opacity:.8;flex:1}
.nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.nav-btn:hover{background:rgba(255,255,255,.2)}
.page{max-width:1400px;margin:0 auto;padding:24px 20px}

.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid #e2e8f0}
.stat-card.dark{border-left-color:#2d3748}.stat-card.blue{border-left-color:#3498db}
.stat-card.orange{border-left-color:#f59e0b}.stat-card.green{border-left-color:#27ae60}.stat-card.red{border-left-color:#e74c3c}
.stat-lbl{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-val{font-size:20px;font-weight:700;color:#1a1a2e;margin-top:4px}
.stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}

.filter-bar{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-bar label{font-size:12px;color:#64748b;font-weight:600}
.filter-bar select,.filter-bar input{border:1px solid #e2e8f0;border-radius:8px;padding:7px 11px;font-size:13px;outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:#2d3748}
.spacer{flex:1}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-dark{background:#2d3748;color:#fff}.btn-dark:hover{background:#1a1a2e}
.btn-outline{background:#fff;border:1px solid #e2e8f0;color:#374151}.btn-outline:hover{background:#f8fafc}
.btn-sm{padding:5px 12px;font-size:12px}

.table-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;margin-bottom:24px}
.table-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f5f9}
.table-title{font-size:15px;font-weight:700}
.cnt{font-size:12px;color:#94a3b8;background:#f1f5f9;padding:3px 10px;border-radius:20px}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;background:#f8fafc;border-bottom:1px solid #e2e8f0}
td{padding:10px 16px;font-size:12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#374151}
tr:hover td{background:#fafafa}
.empty td{text-align:center;padding:40px;color:#94a3b8;font-style:italic}

.action-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.mod-chip{background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;white-space:nowrap}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.page-btn{padding:6px 14px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#374151}
.page-btn:hover{background:#f8fafc}
.page-btn.active{background:#2d3748;color:#fff;border-color:#2d3748}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:13px;color:#64748b}
</style>
</head>
<body>
<nav class="nav">
  <span class="nav-brand">&#9679; POS</span>
  <span class="nav-sub">Audit Trail — System Activity Log</span>
  <a href="/admin" class="nav-btn">&#8592; Admin Dashboard</a>
</nav>

<div class="page">
  <div class="stats-bar">
    <div class="stat-card dark"><div class="stat-lbl">Total Events</div><div class="stat-val" id="sTotal">—</div><div class="stat-sub">all time</div></div>
    <div class="stat-card blue"><div class="stat-lbl">Today</div><div class="stat-val" id="sToday">—</div><div class="stat-sub">events today</div></div>
    <div class="stat-card orange"><div class="stat-lbl">This Week</div><div class="stat-val" id="sWeek">—</div><div class="stat-sub">events</div></div>
    <div class="stat-card green"><div class="stat-lbl">Modules</div><div class="stat-val" id="sMods">—</div><div class="stat-sub">tracked</div></div>
    <div class="stat-card red"><div class="stat-lbl">Unique Users</div><div class="stat-val" id="sUsers">—</div><div class="stat-sub">active</div></div>
  </div>

  <div class="filter-bar">
    <label>Module</label>
    <select id="fModule" onchange="loadLogs(1)">
      <option value="">All Modules</option>
      <option value="Sales Returns">Sales Returns</option>
      <option value="Inventory">Inventory</option>
      <option value="Credit Sales">Credit Sales</option>
      <option value="HR">HR</option>
      <option value="Payments">Payments</option>
      <option value="Procurement">Procurement</option>
      <option value="Products">Products</option>
      <option value="Users">Users</option>
    </select>
    <label>Action</label>
    <input type="text" id="fAction" placeholder="e.g. CREATE, DELETE..." style="width:160px" oninput="debounce(()=>loadLogs(1),400)">
    <label>User</label>
    <input type="text" id="fUser" placeholder="Username..." style="width:140px" oninput="debounce(()=>loadLogs(1),400)">
    <label>From</label><input type="date" id="fFrom" onchange="loadLogs(1)">
    <label>To</label><input type="date" id="fTo" onchange="loadLogs(1)">
    <div class="spacer"></div>
    <button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear</button>
    <button class="btn btn-dark btn-sm" onclick="loadLogs(1)">&#8635; Refresh</button>
  </div>

  <div class="table-card">
    <div class="table-head">
      <span class="table-title">&#128203; Activity Log</span>
      <span class="cnt" id="logCount">0 events</span>
    </div>
    <table>
      <thead><tr>
        <th>Timestamp</th><th>User</th><th>Role</th><th>Module</th><th>Action</th><th>Details</th><th>Record ID</th><th>IP Address</th>
      </tr></thead>
      <tbody id="logBody"><tr class="empty"><td colspan="8">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<script>
const fmtDT = d => d ? new Date(d).toLocaleString('en-PK',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}) : '—';

let debTimer = null;
function debounce(fn, ms) { clearTimeout(debTimer); debTimer = setTimeout(fn, ms); }

let currentPage = 1, totalPages = 1;

const MODULE_COLORS = {
  'Sales Returns':'#fee2e2;color:#991b1b', 'Inventory':'#fef3c7;color:#92400e',
  'Credit Sales':'#dbeafe;color:#1e40af', 'HR':'#f3e8ff;color:#6d28d9',
  'Payments':'#d1fae5;color:#065f46', 'Procurement':'#fce7f3;color:#9d174d',
  'Products':'#e0f2fe;color:#0369a1', 'Users':'#f1f5f9;color:#374151',
};
const ACTION_COLORS = {
  CREATE:'#d1fae5;color:#065f46', CREATED:'#d1fae5;color:#065f46',
  UPDATE:'#dbeafe;color:#1e40af', UPDATED:'#dbeafe;color:#1e40af',
  DELETE:'#fee2e2;color:#991b1b', DELETED:'#fee2e2;color:#991b1b',
  LOGIN:'#f0fdf4;color:#166534', LOGOUT:'#f9fafb;color:#374151',
  APPROVE:'#ecfdf5;color:#065f46', REJECT:'#fef2f2;color:#991b1b',
  PAY:'#eff6ff;color:#1d4ed8', PAYMENT:'#eff6ff;color:#1d4ed8',
};

document.addEventListener('DOMContentLoaded', () => {
  loadStats();
  loadLogs(1);
});

async function loadStats() {
  try {
    const today = new Date().toISOString().split('T')[0];
    const week  = new Date(Date.now()-7*86400000).toISOString().split('T')[0];
    const [all, tod, wk] = await Promise.all([
      fetch('/api/audit-log?page=1').then(r=>r.json()),
      fetch(`/api/audit-log?from=${today}&page=1`).then(r=>r.json()),
      fetch(`/api/audit-log?from=${week}&page=1`).then(r=>r.json()),
    ]);
    document.getElementById('sTotal').textContent = all.total || 0;
    document.getElementById('sToday').textContent = tod.total || 0;
    document.getElementById('sWeek').textContent  = wk.total || 0;
  } catch(e) {}
}

async function loadLogs(page) {
  currentPage = page;
  const params = new URLSearchParams({ page });
  const module = document.getElementById('fModule').value;
  const action = document.getElementById('fAction').value.trim();
  const user   = document.getElementById('fUser').value.trim();
  const from   = document.getElementById('fFrom').value;
  const to     = document.getElementById('fTo').value;
  if (module) params.append('module', module);
  if (action) params.append('action', action);
  if (user)   params.append('user',   user);
  if (from)   params.append('from',   from);
  if (to)     params.append('to',     to);

  document.getElementById('logBody').innerHTML = '<tr class="empty"><td colspan="8">Loading...</td></tr>';
  try {
    const d = await fetch('/api/audit-log?' + params).then(r=>r.json());
    totalPages = d.pages || 1;
    document.getElementById('logCount').textContent = (d.total||0) + ' events';

    const logs = d.logs || [];
    if (!logs.length) {
      document.getElementById('logBody').innerHTML = '<tr class="empty"><td colspan="8">No audit events found</td></tr>';
      renderPagination();
      return;
    }

    // Gather stats from current page
    const modules = new Set(logs.map(l=>l.module)); document.getElementById('sMods').textContent = modules.size;
    const users   = new Set(logs.map(l=>l.user));   document.getElementById('sUsers').textContent = users.size;

    document.getElementById('logBody').innerHTML = logs.map(l => {
      const modStyle  = MODULE_COLORS[l.module] || '#f1f5f9;color:#374151';
      const actKey    = (l.action||'').split('_')[0];
      const actStyle  = ACTION_COLORS[actKey] || '#f1f5f9;color:#374151';
      const roleCls   = {admin:'#fde8e8;color:#c0392b', sales_manager:'#d5f5e3;color:#1a6b3a',
                         sales_person:'#eafaf1;color:#27ae60', procurement_manager:'#fef5e7;color:#d35400',
                         finance_manager:'#f0e6ff;color:#6c3483'}[l.role] || '#f1f5f9;color:#374151';
      return `<tr>
        <td style="white-space:nowrap;color:#64748b">${fmtDT(l.created_at)}</td>
        <td><strong>${l.user||'System'}</strong></td>
        <td><span style="background:${roleCls};padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700">${(l.role||'').replace(/_/g,' ')}</span></td>
        <td><span class="mod-chip" style="background:${modStyle.split(';')[0]};${modStyle.split(';')[1]||''}">${l.module||'—'}</span></td>
        <td><span class="action-badge" style="background:${actStyle.split(';')[0]};${actStyle.split(';')[1]||''}">${l.action||'—'}</span></td>
        <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151" title="${l.details||''}">${l.details||'—'}</td>
        <td style="font-family:monospace;font-size:10px;color:#94a3b8">${l.record_id?l.record_id.slice(-8)+'…':'—'}</td>
        <td style="color:#94a3b8;font-family:monospace;font-size:10px">${l.ip||'—'}</td>
      </tr>`;
    }).join('');
    renderPagination();
  } catch(e) {
    document.getElementById('logBody').innerHTML = '<tr class="empty"><td colspan="8">Failed to load audit log</td></tr>';
  }
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="loadLogs(${currentPage-1})" ${currentPage===1?'disabled':''}>&#8592; Prev</button>`;
  const start = Math.max(1, currentPage-2), end = Math.min(totalPages, currentPage+2);
  if (start > 1) html += `<button class="page-btn" onclick="loadLogs(1)">1</button>${start>2?'<span class="page-info">…</span>':''}`;
  for (let p = start; p <= end; p++) html += `<button class="page-btn ${p===currentPage?'active':''}" onclick="loadLogs(${p})">${p}</button>`;
  if (end < totalPages) html += `${end<totalPages-1?'<span class="page-info">…</span>':''}<button class="page-btn" onclick="loadLogs(${totalPages})">${totalPages}</button>`;
  html += `<button class="page-btn" onclick="loadLogs(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next &#8594;</button>`;
  html += `<span class="page-info">Page ${currentPage} of ${totalPages}</span>`;
  el.innerHTML = html;
}

function clearFilters() {
  document.getElementById('fModule').value = '';
  document.getElementById('fAction').value = '';
  document.getElementById('fUser').value   = '';
  document.getElementById('fFrom').value   = '';
  document.getElementById('fTo').value     = '';
  loadLogs(1);
}
</script>
</body>
</html>
