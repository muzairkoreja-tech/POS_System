<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - POS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px 10px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .forgot-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .forgot-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .forgot-header i {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .forgot-header h2 {
            font-size: 22px;
            font-weight: 600;
        }
        .forgot-header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .forgot-body {
            padding: 30px;
        }
        .forgot-body .form-group {
            margin-bottom: 20px;
        }
        .forgot-body .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .forgot-body .input-wrapper {
            position: relative;
        }
        .forgot-body .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .forgot-body .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .forgot-body .input-wrapper input:focus {
            outline: none;
            border-color: #f093fb;
        }
        .forgot-body .info-box {
            background: #fef3e2;
            border-left: 4px solid #f5576c;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        .forgot-body .error-msg {
            background: #fee;
            color: #c0392b;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .forgot-body .error-msg.show {
            display: block;
        }
        .forgot-body .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
        .forgot-body .success-msg.show {
            display: block;
        }
        .btn-forgot {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-forgot:hover { opacity: 0.9; }
        .btn-forgot:disabled { opacity: 0.6; cursor: not-allowed; }
        .forgot-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .forgot-footer a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .forgot-footer a:hover { text-decoration: underline; }
        .forgot-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-header">
            <i class="fas fa-key"></i>
            <h2>Forgot Password</h2>
            <p>Enter your email to reset your password</p>
        </div>
        <div class="forgot-body">
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            <form id="forgotForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email address" required autocomplete="email">
                    </div>
                </div>
                <div class="info-box">
                    <i class="fas fa-info-circle"></i>
                    Enter the email address associated with your account, and we'll send you a link to reset your password.
                </div>
                <button type="submit" class="btn-forgot" id="forgotBtn" onclick="handleForgotPassword()">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>
            <div class="forgot-footer">
                <a onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleForgotPassword() {
            const btn = document.getElementById('forgotBtn');
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            if (!email) {
                errorMsg.textContent = 'Please enter your email address';
                errorMsg.classList.add('show');
                return;
            }

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="forgot-spinner"></span> Sending...';

            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    successMsg.textContent = 'If the email exists in our system, a password reset link has been sent.';
                    successMsg.classList.add('show');
                    document.getElementById('forgotForm').reset();
                } else {
                    errorMsg.textContent = data.message;
                    errorMsg.classList.add('show');
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
            })
            .catch(err => {
                errorMsg.textContent = 'Failed to send reset link. Please try again.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
            });
        }

        function goBack() {
            window.location.href = '/login';
        }

        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleForgotPassword();
        });
    </script>
</body>
</html>
