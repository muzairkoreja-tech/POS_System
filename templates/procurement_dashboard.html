<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Dashboard - POS System</title>
<link rel="stylesheet" href="../static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f6fa;min-height:100vh;overflow-y:auto}
.dashboard-nav{background:linear-gradient(135deg,#2c3e50,#34495e);color:#fff;padding:0 24px;display:flex;justify-content:space-between;align-items:center;height:60px;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100}
.nav-brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600}
.nav-brand i{font-size:24px;color:#27ae60}
.nav-right{display:flex;align-items:center;gap:20px}
.nav-user{display:flex;align-items:center;gap:8px;font-size:14px}
.nav-user i{font-size:20px}
.nav-user .role-badge{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px;font-size:11px;text-transform:uppercase}
.btn-logout{background:rgba(231,76,60,.8);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .3s}
.btn-logout:hover{background:#e74c3c}
.dashboard-container{max-width:1200px;margin:0 auto;padding:24px}
.page-title{font-size:24px;font-weight:700;color:#2c3e50;margin-bottom:8px}
.page-subtitle{color:#7f8c8d;font-size:14px;margin-bottom:24px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-bottom:32px}
.kpi-card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center;cursor:pointer;transition:all .3s;border-left:4px solid #3498db;text-decoration:none;color:inherit;display:block}
.kpi-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.kpi-card:nth-child(1){border-left-color:#3498db}
.kpi-card:nth-child(2){border-left-color:#9b59b6}
.kpi-card:nth-child(3){border-left-color:#27ae60}
.kpi-card:nth-child(4){border-left-color:#e67e22}
.kpi-card:nth-child(5){border-left-color:#e74c3c}
.kpi-card:nth-child(6){border-left-color:#1abc9c}
.kpi-icon{font-size:32px;margin-bottom:8px;color:#fff}
.kpi-card h3{font-size:24px;color:#2c3e50;margin-bottom:2px}
.kpi-card p{color:#7f8c8d;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.section-panel{background:#fff;border-radius:10px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:24px;display:none}
.section-panel.active{display:block}
.section-panel h3{font-size:18px;color:#2c3e50;margin-bottom:16px}
.section-panel h3 i{color:#3498db;margin-right:8px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th{background:#f8f9fa;padding:12px 16px;text-align:left;font-size:12px;color:#7f8c8d;text-transform:uppercase;border-bottom:2px solid #eee}
td{padding:12px 16px;border-bottom:1px solid #eee;font-size:14px}
tr:hover{background:#f8f9fa}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#555;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:2px solid #eee;border-radius:6px;font-size:14px;transition:border-color .3s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#3498db}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.btn-action{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;margin-right:8px;margin-bottom:8px}
.btn-primary{background:#3498db;color:#fff}
.btn-success{background:#27ae60;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-warning{background:#e67e22;color:#fff}
.btn-secondary{background:#ecf0f1;color:#2c3e50}
.btn-action:hover{opacity:.9}
.role-tag{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase}
.toast{position:fixed;bottom:20px;right:20px;background:#2c3e50;color:#fff;padding:12px 24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2);display:none;animation:slideUp .3s ease;z-index:2000}
.toast.success{background:#27ae60}.toast.error{background:#e74c3c}
.toast.show{display:block}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.file-upload{border:2px dashed #ccc;padding:40px;text-align:center;border-radius:8px;margin:16px 0;cursor:pointer;transition:border-color .3s}
.file-upload:hover{border-color:#3498db}
.file-upload input{display:none}
</style>
</head>
<body>
<nav class="dashboard-nav">
<div class="nav-brand"><i class="fas fa-truck-loading"></i><span>POS System - Procurement</span></div>
<div class="nav-right">
<div class="nav-user"><i class="fas fa-user-circle"></i><span id="navUserName">Procurement</span><span class="role-badge" id="navRoleBadge">Procurement</span></div>
<button class="btn-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>
</nav>
<div class="dashboard-container">
<h1 class="page-title"><i class="fas fa-truck-loading"></i> Procurement Dashboard</h1>
<p class="page-subtitle">Manage vendors, stock, products, and procurement operations</p>
<div class="kpi-grid">
<a class="kpi-card" onclick="showSection('vendors')" style="cursor:pointer">
<div class="kpi-icon"><i class="fas fa-building"></i></div><h3 id="kpiVendors">-</h3><p>Vendors</p>
</a>
<div class="kpi-card" style="position:relative;cursor:pointer" onclick="toggleProductsMenu(event)">
<div class="kpi-icon"><i class="fas fa-boxes"></i></div><h3 id="kpiProducts">-</h3><p>Products</p>
<div id="productsMenu" class="products-context-menu" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:100;padding:8px 0;margin-top:8px">
<a onclick="window.location.href='/products'" style="display:block;padding:10px 16px;color:#2c3e50;text-decoration:none;font-size:14px"><i class="fas fa-plus"></i> Add Product</a>
 <a onclick="showExcelUploader();hideProductsMenu()" style="display:block;padding:10px 16px;color:#2c3e50;text-decoration:none;font-size:14px"><i class="fas fa-file-excel"></i> Excel Uploader</a>
</div>
</div>
<a class="kpi-card" onclick="showSection('stock')" style="cursor:pointer">
<div class="kpi-icon"><i class="fas fa-cubes"></i></div><h3 id="kpiLowStock">-</h3><p>Low Stock</p>
</a>
<a class="kpi-card" onclick="showSection('orders')" style="cursor:pointer">
<div class="kpi-icon"><i class="fas fa-file-invoice-dollar"></i></div><h3 id="kpiOrders">-</h3><p>Orders</p>
</a>
<a class="kpi-card" onclick="showSection('reports')" style="cursor:pointer">
<div class="kpi-icon"><i class="fas fa-chart-bar"></i></div><h3>Reports</h3><p>Analytics</p>
</a>
 <a class="kpi-card" onclick="showSection('qr')" style="cursor:pointer">
 <div class="kpi-icon"><i class="fas fa-qrcode"></i></div><h3>QR Code</h3><p>Generate</p>
 </a>
 <a class="kpi-card" onclick="showSection('units')" style="cursor:pointer">
 <div class="kpi-icon"><i class="fas fa-ruler-combined"></i></div><h3 id="kpiUnits">-</h3><p>Units</p>
 </a>
 <a class="kpi-card" onclick="showSection('categories')" style="cursor:pointer">
 <div class="kpi-icon"><i class="fas fa-tags"></i></div><h3 id="kpiCategories">-</h3><p>Categories</p>
 </a>
 <a class="kpi-card" onclick="showSection('groups')" style="cursor:pointer">
 <div class="kpi-icon"><i class="fas fa-layer-group"></i></div><h3 id="kpiGroups">-</h3><p>Groups</p>
 </a>
 <a class="kpi-card" onclick="showSection('colors')" style="cursor:pointer">
 <div class="kpi-icon"><i class="fas fa-palette"></i></div><h3 id="kpiColors">-</h3><p>Colors</p>
 </a>
 </div>
<div id="sectionContent"></div>
</div>
<div id="toastContainer"></div>

<script>
let unitsData = [];
let colorsData = [];
let editingUnitId = null;
let editingColorId = null;

document.addEventListener("DOMContentLoaded",function(){
document.getElementById("navUserName").textContent=sessionStorage.getItem("full_name")||"Procurement Manager";
document.getElementById("navRoleBadge").textContent=(sessionStorage.getItem("role")||"procurement_manager").replace(/_/g," ");
loadStats();
});

  async function loadStats(){
  try{
      const safeFetch = async (url, fallback = []) => {
          try {
              const r = await fetch(url);
              return await r.json();
          } catch(e) {
              console.error('Failed to fetch:', url, e);
              return fallback;
          }
      };
      const [prods,vendors,orders,stats,units,categories,groups,colors] = await Promise.all([
          safeFetch("/api/products"),
          safeFetch("/api/vendors"),
          safeFetch("/api/purchase-orders"),
          safeFetch("/api/stats/today"),
          safeFetch("/api/units"),
          safeFetch("/api/categories"),
          safeFetch("/api/product-groups"),
          safeFetch("/api/colors")
      ]);
      document.getElementById("kpiProducts").textContent = (prods && prods.length) || 0;
      document.getElementById("kpiVendors").textContent = (vendors && vendors.length) || 0;
      document.getElementById("kpiOrders").textContent = (orders && orders.length) || 0;
      document.getElementById("kpiLowStock").textContent = (stats && stats.low_stock_products) || 0;
      document.getElementById("kpiUnits").textContent = (units && units.length) || 0;
      document.getElementById("kpiCategories").textContent = (categories && categories.length) || 0;
      document.getElementById("kpiGroups").textContent = (groups && groups.length) || 0;
      document.getElementById("kpiColors").textContent = (colors && colors.length) || 0;
  }catch(e){console.error(e)}
  }

 function showSection(n){
 const el=document.getElementById("sectionContent");
 const m={vendors:rVendors,products:rProducts,stock:rStock,orders:rOrders,reports:rReports,qr:rQR,units:rUnits,categories:rCategories,groups:rGroups,colors:rColors};
 if(m[n])m[n](el);
 }

function rVendors(el){
el.innerHTML='<div class="section-panel active"><h3><i class="fas fa-building"></i> Vendor Management</h3><div class="action-bar"><button class="btn-action btn-primary" onclick="showVF()">+ Add Vendor</button><button class="btn-action btn-secondary" onclick="loadVs()"><i class="fas fa-sync"></i> Refresh</button></div><div id="vF" style="display:none;margin:16px 0;padding:16px;background:#f8f9fa;border-radius:8px"><div id="vendorWizard"><div class="wizard-steps"><div class="wizard-step active" data-step="1"><span class="step-number">1</span><span class="step-label">General</span></div><div class="wizard-step" data-step="2"><span class="step-number">2</span><span class="step-label">Discounts</span></div><div class="wizard-step" data-step="3"><span class="step-number">3</span><span class="step-label">Loyalty</span></div><div class="wizard-step" data-step="4"><span class="step-number">4</span><span class="step-label">Payment Terms</span></div><div class="wizard-step" data-step="5"><span class="step-number">5</span><span class="step-label">Review</span></div></div><div class="wizard-content"><!-- Step 1: General Info --><div class="wizard-panel active" data-panel="1"><h4 style="margin-bottom:16px">General Information</h4><div class="form-row"><div class="form-group"><label>Vendor Name *</label><input id="vn" placeholder="Enter vendor name"></div><div class="form-group"><label>Code</label><input id="vCode" placeholder="Vendor code (optional)"></div></div><div class="form-row"><div class="form-group"><label>Tax Number</label><input id="vTaxNo" placeholder="Tax registration number"></div><div class="form-group"><label>Phone Number *</label><input id="vp" placeholder="Phone with country code"></div></div><div class="form-group"><label>Email *</label><input type="email" id="ve" placeholder="Email address"></div><div class="form-group"><label>Street Name</label><input id="vStreet" placeholder="Street name"></div><div class="form-row"><div class="form-group"><label>Building Number</label><input id="vBuilding" placeholder="Building/house number"></div><div class="form-group"><label>Additional Street</label><input id="vAddStreet" placeholder="Additional street info"></div></div><div class="form-row"><div class="form-group"><label>Plot Identification</label><input id="vPlot" placeholder="Plot number"></div><div class="form-group"><label>District</label><input id="vDistrict" placeholder="District"></div></div><div class="form-row"><div class="form-group"><label>City *</label><input id="vCity" placeholder="City"></div><div class="form-group"><label>State/Province</label><input id="vState" placeholder="State or province"></div></div><div class="form-row"><div class="form-group"><label>Country</label><input id="vCountry" placeholder="Country" value="Pakistan"></div><div class="form-group"><label>Postal Code</label><input id="vPostal" placeholder="Postal code"></div></div><div class="form-row"><div class="form-group"><label>Mobile</label><input id="vm" placeholder="Mobile number"></div><div class="form-group"><label>Website</label><input id="vWeb" placeholder="Website URL"></div></div><div class="form-row"><div class="form-group"><label>Contact Person</label><input id="vc" placeholder="Primary contact name"></div><div class="form-group"><label>Designation</label><input id="vDesg" placeholder="Job title"></div></div><div class="form-row"><div class="form-group"><label>Status</label><select id="vs"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="form-group"><label>Is Customer?</label><select id="vIsCustomer"><option value="false">No</option><option value="true">Yes</option></select></div></div></div><!-- Step 2: Discounts --><div class="wizard-panel" data-panel="2"><h4 style="margin-bottom:16px">Discount Configuration</h4><div class="form-row"><div class="form-group"><label>Enable Discounts</label><input type="checkbox" id="vDiscEnabled"></div></div><div class="form-row" id="discountFields" style="display:none"><div class="form-group"><label>Discount Type</label><select id="vDiscType"><option value="percentage">Percentage</option><option value="fixed">Fixed Amount</option></select></div><div class="form-group"><label>Discount Value</label><input id="vDiscValue" type="number" min="0" step="0.01" placeholder="Discount amount"></div><div class="form-group"><label>Max Discount (%)</label><input id="vMaxDisc" type="number" min="0" max="100" placeholder="Max discount"></div><div class="form-group"><label>Seasonal Discount (%)</label><input id="vSeasonDisc" type="number" min="0" max="100" placeholder="Seasonal discount"></div></div><div class="form-group"><label>Discount Notes</label><textarea id="vDiscNotes" rows="3" placeholder="Any notes about discount policy"></textarea></div></div><!-- Step 3: Loyalty --><div class="wizard-panel" data-panel="3"><h4 style="margin-bottom:16px">Loyalty Program</h4><div class="form-row"><div class="form-group"><label>Enable Loyalty</label><input type="checkbox" id="vLoyaltyEnabled"></div></div><div class="form-row" id="loyaltyFields" style="display:none"><div class="form-group"><label>Points per PKR</label><input id="vPointsPer" type="number" min="0" step="0.1" placeholder="Points earned per PKR spent"></div><div class="form-group"><label>Points Multiplier</label><input id="vPointsMult" type="number" min="1" step="1" value="1" placeholder="Bonus multiplier"></div><div class="form-group"><label>Max Points/Month</label><input id="vMaxPoints" type="number" min="0" placeholder="0 for unlimited"></div><div class="form-group"><label>Card Expiry (months)</label><input id="vCardExp" type="number" min="0" placeholder="0 for never"></div><div class="form-group"><label>Tier</label><select id="vLoyaltyTier"><option value="standard">Standard</option><option value="silver">Silver</option><option value="gold">Gold</option><option value="platinum">Platinum</option></select></div></div><div class="form-group"><label>Loyalty Notes</label><textarea id="vLoyaltyNotes" rows="3" placeholder="Loyalty program details"></textarea></div></div><!-- Step 4: Payment & Financial --><div class="wizard-panel" data-panel="4"><h4 style="margin-bottom:16px">Payment Terms & Financial</h4><div class="form-row"><div class="form-group"><label>Payment Terms *</label><select id="vt"><option value="Net 15">Net 15</option><option value="Net 30">Net 30</option><option value="Net 45">Net 45</option><option value="Cash on Delivery">Cash on Delivery</option><option value="Advance">Advance Payment</option></select></div><div class="form-group"><label>Currency</label><select id="vCurr"><option value="PKR">PKR</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option></select></div></div><div class="form-row"><div class="form-group"><label>Credit Limit (PKR)</label><input id="vcl" type="number" min="0" step="0.01" value="0"></div><div class="form-group"><label>Initial Balance (PKR)</label><input id="vBal" type="number" step="0.01" value="0"></div></div><div class="form-group"><label>Bank Name</label><input id="vBank" placeholder="Bank name"></div><div class="form-row"><div class="form-group"><label>Branch</label><input id="vBranch" placeholder="Branch location"></div><div class="form-group"><label>Account Title</label><input id="vAccTitle" placeholder="Account holder name"></div></div><div class="form-group"><label>Account Number</label><input id="vAccNo" placeholder="Account number"></div><div class="form-group"><label>Notes</label><textarea id="vNotes" rows="3" placeholder="Additional notes"></textarea></div><div class="form-row"><div class="form-group"><label><input type="checkbox" id="vActive" checked> Active</label></div><div class="form-group"><label><input type="checkbox" id="vIsCustomer" value="true"> Also a Customer</label></div></div></div><!-- Step 5: Review --><div class="wizard-panel" data-panel="5"><h4 style="margin-bottom:16px">Review Vendor Information</h4><div id="vendorReview" style="background:#f8f9fa;padding:16px;border-radius:8px"></div></div></div><div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid #eee"><button id="prevBtn" class="btn-action btn-secondary" style="display:none" onclick="prevWizardStep()"><i class="fas fa-arrow-left"></i> Previous</button><button id="nextBtn" class="btn-action btn-primary" onclick="nextWizardStep()">Next <i class="fas fa-arrow-right"></i></button></div></div></div><table><thead><tr><th>#</th><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th><th>Payment Terms</th><th>Action</th></tr></thead><tbody id="vT"></tbody></table></div>';
loadVs();
initVendorWizard();
}

async function loadVs(){
try{
var v=await fetch("/api/vendors").then(r=>r.json());
var tb=document.getElementById("vT");
if(!v.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:20px;color:#999">No vendors found</td></tr>';return}
var h="";
v.forEach(function(x,i){
var c=x.status==="active"?"#1e8449":"#b9770e";var bg=x.status==="active"?"#d5f5e3":"#fdebd0";
h+="<tr><td>"+(i+1)+"</td><td><strong>"+x.name+"</strong></td><td>"+(x.contact_person||"-")+"</td><td>"+(x.phone||"-")+"</td><td>"+(x.email||"-")+"</td><td><span class='role-tag' style='background:"+bg+";color:"+c+"'>"+x.status+"</span></td><td>"+(x.payment_terms||"-")+"</td><td><button class='btn-action btn-danger' style='padding:4px 8px;font-size:11px' onclick=\"delV('"+x._id+"')\">Delete</button></td></tr>"
});
tb.innerHTML=h;
}catch(e){console.error(e);tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:20px;color:#e74c3c">Failed to load vendors</td></tr>';}
}

function showVF(){document.getElementById("vF").style.display="block"}

async function saveV(){
var v={name:document.getElementById("vn").value.trim(),contact_person:document.getElementById("vc").value.trim(),phone:document.getElementById("vp").value.trim(),email:document.getElementById("ve").value.trim(),address:document.getElementById("va").value.trim(),payment_terms:document.getElementById("vt").value,status:document.getElementById("vs").value,credit_limit:parseFloat(document.getElementById("vcl").value)||0};
if(!v.name){showT("Vendor name is required","error");return}
try{
var r=await fetch("/api/vendors",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
if(r.ok){showT("Vendor saved successfully!","success");document.getElementById("vF").style.display="none";loadVs()}
else{var d=await r.json();showT(d.message||"Error saving vendor","error")}
}catch(e){showT("Failed to save vendor","error")}
}

async function delV(id){
if(!confirm("Are you sure you want to delete this vendor?"))return;
try{
var r=await fetch("/api/vendors/"+id,{method:"DELETE"});var d=await r.json();
if(d.success){showT("Vendor deleted successfully","success");loadVs()}else showT(d.message||"Failed to delete vendor","error")
}catch(e){showT("Failed to delete vendor","error")}
}

function rProducts(el){
window.location.href='/products';
}

async function loadPs(){
try{
var p=await fetch("/api/products").then(r=>r.json());
var tb=document.getElementById("pT");
if(!p.length){tb.innerHTML='<tr><td colspan="9" style="text-align:center;padding:20px;color:#999">No products found</td></tr>';return}
var h="";
     p.forEach(function(x){
         var isLowStock = (x.stock||0) < (x.reorder_level||10);
         var sc = x.status === 'active' ? (isLowStock ? '#fff3cd' : '#d5f5e3') : '#e0e0e0';
         var sc2 = x.status === 'active' ? (isLowStock ? '#856404' : '#1e8449') : '#666';
h+="<tr><td>"+x._id+"</td><td><strong>"+x.name+"</strong></td><td>"+(x.category||"-")+"</td><td>"+(x.supplier||"-")+"</td><td>PKR "+parseFloat(x.price).toFixed(2)+"</td><td>"+(x.stock||0)+" "+(x.unit||"")+"</td><td><span class='role-tag' style='background:"+sc+";color:"+sc2+"'>"+(x.status||"active")+"</span></td><td>"+(x.expiry_date||"-")+"</td><td>"+(x.batch_no||"-")+"</td></tr>"
});
tb.innerHTML=h;
}catch(e){console.error(e);tb.innerHTML='<tr><td colspan="9" style="text-align:center;padding:20px;color:#e74c3c">Failed to load products</td></tr>';}
}

function rStock(el){
el.innerHTML='<div class="section-panel active"><h3><i class="fas fa-cubes"></i> Low Stock Alert</h3><table><thead><tr><th>#</th><th>Product</th><th>Category</th><th>Supplier</th><th>Stock</th><th>Reorder Lvl</th><th>Unit</th><th>Price(PKR)</th></tr></thead><tbody id="sT"><tr><td colspan="8" style="text-align:center;padding:30px"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr></tbody></table></div>';
loadStk();
}

async function loadStk(){
try{
var p=await fetch("/api/products").then(r=>r.json());
var low=p.filter(function(x){return(x.stock||0)<(x.reorder_level||10)});
var tb=document.getElementById("sT");
if(!low.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:20px;color:#27ae60"><i class="fas fa-check-circle"></i> All well stocked!</td></tr>';return}

function showT(m,t){
var ex=document.querySelector(".toast");if(ex)ex.remove();
var e=document.createElement("div");e.className="toast "+t;e.textContent=m;
document.getElementById("toastContainer").appendChild(e);
setTimeout(function(){e.classList.add("show");setTimeout(function(){e.classList.remove("show");setTimeout(function(){e.remove()},300)},3000)},100);
}

// Vendor Wizard Functions
let currentWizardStep = 1;
const totalWizardSteps = 5; // General, Discounts, Loyalty, Payment Terms, Review

function initVendorWizard() {
    currentWizardStep = 1;
    // Discount toggle
    const discEnabled = document.getElementById('vDiscEnabled');
    const discFields = document.getElementById('discountFields');
    if(discEnabled && discFields) {
        discEnabled.addEventListener('change', function() {
            discFields.style.display = this.checked ? 'grid' : 'none';
        });
    }
    // Loyalty toggle
    const loyaltyEnabled = document.getElementById('vLoyaltyEnabled');
    const loyaltyFields = document.getElementById('loyaltyFields');
    if(loyaltyEnabled && loyaltyFields) {
        loyaltyEnabled.addEventListener('change', function() {
            loyaltyFields.style.display = this.checked ? 'grid' : 'none';
        });
    }
    updateWizardUI();
}

function updateWizardUI() {
    // Update step indicators
    document.querySelectorAll('.wizard-step').forEach(step => {
        const stepNum = parseInt(step.dataset.step);
        step.classList.remove('active', 'completed');
        if (stepNum === currentWizardStep) {
            step.classList.add('active');
        } else if (stepNum < currentWizardStep) {
            step.classList.add('completed');
        }
    });

    // Show/hide panels
    document.querySelectorAll('.wizard-panel').forEach(panel => {
        panel.classList.remove('active');
        if (parseInt(panel.dataset.panel) === currentWizardStep) {
            panel.classList.add('active');
        }
    });

    // Update buttons
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    if (currentWizardStep === 1) {
        prevBtn.style.display = 'none';
    } else {
        prevBtn.style.display = 'inline-flex';
    }

    if (currentWizardStep === totalWizardSteps) {
        nextBtn.innerHTML = '<i class="fas fa-save"></i> Save Vendor';
        nextBtn.onclick = saveVendorWizard;
    } else {
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
        nextBtn.onclick = nextWizardStep;
    }

    // Build review on last step
    if (currentWizardStep === totalWizardSteps) {
        buildVendorReview();
    }
}

function nextWizardStep() {
    if (!validateCurrentStep()) {
        return;
    }
    if (currentWizardStep < totalWizardSteps) {
        currentWizardStep++;
        updateWizardUI();
    }
}

function prevWizardStep() {
    if (currentWizardStep > 1) {
        currentWizardStep--;
        updateWizardUI();
    }
}

function validateCurrentStep() {
    const step = currentWizardStep;
    if (step === 1) {
        const name = document.getElementById('vn').value.trim();
        const phone = document.getElementById('vp').value.trim();
        const email = document.getElementById('ve').value.trim();
        if (!name) {
            showT('Vendor name is required', 'error');
            return false;
        }
        if (!phone) {
            showT('Phone number is required', 'error');
            return false;
        }
        if (!email) {
            showT('Email is required', 'error');
            return false;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showT('Invalid email format', 'error');
            return false;
        }
    }
    return true;
}

function collectVendorData() {

        street_name: document.getElementById('vStreet').value.trim(),
        building_number: document.getElementById('vBuilding').value.trim(),
        additional_street: document.getElementById('vAddStreet').value.trim(),
        plot_identification: document.getElementById('vPlot').value.trim(),
        district: document.getElementById('vDistrict').value.trim(),
        postal_code: document.getElementById('vPostal').value.trim(),
        city: document.getElementById('vCity').value.trim(),
        state_province: document.getElementById('vState').value.trim(),
        country: document.getElementById('vCountry').value.trim(),
        phone: document.getElementById('vp').value.trim(),
        mobile: document.getElementById('vm').value.trim(),
        email: document.getElementById('ve').value.trim(),
        website: document.getElementById('vWeb').value.trim(),
        contact_person: document.getElementById('vc').value.trim(),
        designation: document.getElementById('vDesg').value.trim(),
        active: document.getElementById('vActive').checked,
        is_customer: document.getElementById('vIsCustomer').checked,
        // Discounts
        discounts_enabled: document.getElementById('vDiscEnabled').checked,
        discount_type: document.getElementById('vDiscType').value,
        discount_value: parseFloat(document.getElementById('vDiscValue').value) || 0,
        max_discount: parseFloat(document.getElementById('vMaxDisc').value) || 0,
        seasonal_discount: parseFloat(document.getElementById('vSeasonDisc').value) || 0,
        discount_notes: document.getElementById('vDiscNotes').value.trim(),
        // Loyalty
        loyalty_enabled: document.getElementById('vLoyaltyEnabled').checked,
        points_per_currency: parseFloat(document.getElementById('vPointsPer').value) || 0,
        points_multiplier: parseFloat(document.getElementById('vPointsMult').value) || 1,
        max_points_monthly: parseInt(document.getElementById('vMaxPoints').value) || 0,
        card_expiry_months: parseInt(document.getElementById('vCardExp').value) || 0,
        loyalty_tier: document.getElementById('vLoyaltyTier').value,
        loyalty_notes: document.getElementById('vLoyaltyNotes').value.trim(),
        // Payment & Financial
        payment_terms: document.getElementById('vt').value,
        currency: document.getElementById('vCurr').value,
        credit_limit: parseFloat(document.getElementById('vcl').value) || 0,
        initial_balance: parseFloat(document.getElementById('vBal').value) || 0,
        bank_name: document.getElementById('vBank').value.trim(),

function buildVendorReview() {
    const data = collectVendorData();
    const review = document.getElementById('vendorReview');
    let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';

    // General
    html += '<div><h5 style="color:#3498db;margin-bottom:8px">General Info</h5>';
    html += '<p><strong>Name:</strong> ' + (data.name || '-') + '</p>';
    html += '<p><strong>Code:</strong> ' + (data.code || '-') + '</p>';
    html += '<p><strong>Tax Number:</strong> ' + (data.tax_number || '-') + '</p>';
    html += '<p><strong>Phone:</strong> ' + (data.phone || '-') + '</p>';
    html += '<p><strong>Email:</strong> ' + (data.email || '-') + '</p>';
    html += '<p><strong>Address:</strong> ' + [data.street_name, data.building_number, data.additional_street, data.plot_identification, data.district, data.city, data.state_province, data.country, data.postal_code].filter(Boolean).join(', ') || '-' + '</p>';
    html += '<p><strong>Status:</strong> ' + (data.active ? 'Active' : 'Inactive') + '</p>';
    html += '<p><strong>Is Customer:</strong> ' + (data.is_customer ? 'Yes' : 'No') + '</p>';
    html += '</div>';

    // Discounts
    html += '<div><h5 style="color:#e67e22;margin-bottom:8px">Discounts</h5>';
    html += '<p><strong>Enabled:</strong> ' + (data.discounts_enabled ? 'Yes' : 'No') + '</p>';
    if (data.discounts_enabled) {
        html += '<p><strong>Type:</strong> ' + data.discount_type + '</p>';
        html += '<p><strong>Value:</strong> ' + data.discount_value + (data.discount_type === 'percentage' ? '%' : '') + '</p>';
        html += '<p><strong>Max Discount:</strong> ' + data.max_discount + '%</p>';
        html += '<p><strong>Seasonal:</strong> ' + data.seasonal_discount + '%</p>';
    }
    html += '</div>';

    // Loyalty
    html += '<div><h5 style="color:#9b59b6;margin-bottom:8px">Loyalty Program</h5>';
    html += '<p><strong>Enabled:</strong> ' + (data.loyalty_enabled ? 'Yes' : 'No') + '</p>';
    if (data.loyalty_enabled) {
        html += '<p><strong>Points per PKR:</strong> ' + data.points_per_currency + '</p>';
        html += '<p><strong>Multiplier:</strong> ' + data.points_multiplier + 'x</p>';
        html += '<p><strong>Max Monthly:</strong> ' + (data.max_points_monthly || 'Unlimited') + '</p>';
        html += '<p><strong>Card Expiry:</strong> ' + (data.card_expiry_months ? data.card_expiry_months + ' months' : 'Never') + '</p>';
        html += '<p><strong>Tier:</strong> ' + data.loyalty_tier + '</p>';
    }
    html += '</div>';

    // Payment & Financial
    html += '<div><h5 style="color:#27ae60;margin-bottom:8px">Payment & Financial</h5>';
    html += '<p><strong>Terms:</strong> ' + data.payment_terms + '</p>';
    html += '<p><strong>Currency:</strong> ' + data.currency + '</p>';
    html += '<p><strong>Credit Limit:</strong> PKR ' + data.credit_limit.toLocaleString() + '</p>';
    html += '<p><strong>Initial Balance:</strong> PKR ' + data.initial_balance.toFixed(2) + '</p>';
    if (data.bank_name) {
        html += '<p><strong>Bank:</strong> ' + data.bank_name + (data.branch ? ' (' + data.branch + ')' : '') + '</p>';
        html += '<p><strong>Account:</strong> ' + data.account_title + ' - ' + data.account_number + '</p>';
    }
    html += '</div>';

    html += '</div>';
    if (data.notes) {
        html += '<div style="margin-top:12px"><h5 style="color:#7f8c8d;margin-bottom:4px">Notes</h5><p>' + data.notes + '</p></div>';
    }
    review.innerHTML = html;
}

async function saveVendorWizard() {
    if (!validateCurrentStep()) {
        return;
    }

    const vendor = collectVendorData();

    // Convert empty strings to null/undefined for cleaner DB
    Object.keys(vendor).forEach(key => {
        if (vendor[key] === '' || vendor[key] === null || vendor[key] === undefined) {
            vendor[key] = null;
        }
    });

    try {
        const response = await fetch("/api/vendors", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(vendor)
        });

        if (response.ok) {
            showT("Vendor saved successfully!", "success");
            document.getElementById('vF').style.display = 'none';
            loadVs();
            // Reset wizard
            currentWizardStep = 1;
            resetVendorForm();
            updateWizardUI();
        } else {
            const data = await response.json();
            showT(data.message || "Error saving vendor", "error");
        }
    } catch (e) {
        showT("Failed to save vendor", "error");
    }
}

function resetVendorForm() {
    // Reset all input fields
    const inputs = document.querySelectorAll('#vF input, #vF textarea, #vF select');
    inputs.forEach(input => {
        if (input.type === 'checkbox') {
            input.checked = input.id === 'vActive' ? true : false;
        } else if (input.type === 'number') {
            input.value = input.id === 'vcl' || input.id === 'vBal' ? '0' : '';
        } else {
            input.value = '';
        }
    });
document.getElementById('vCountry').value = 'Pakistan';
    document.getElementById('vt').value = 'Net 30';
    document.getElementById('vCurr').value = 'PKR';
    document.getElementById('vLoyaltyTier').value = 'standard';
}

function closeExcelModal(){
    const m=document.getElementById('excelModal');
    if(m) m.remove();
}
let selectedExcelFile=null;
function handleExcelSelect(e){
    const file=e.target.files[0];
    if(file){
        if(!file.name.match(/\.(xlsx|xls)$/i)){
            showT('Please select a valid Excel file (.xlsx or .xls)','error');
            return;
        }
        selectedExcelFile=file;
        document.getElementById('selectedFile').textContent=file.name;
        document.getElementById('selectedFile').style.display='block';
        document.getElementById('uploadBtn').disabled=false;
    }
}
function selectUploadType(t){
    document.getElementById('invTypeLabel').style.borderColor=t==='inventory'?'#3498db':'#ddd';
    document.getElementById('purTypeLabel').style.borderColor=t==='purchase'?'#e67e22':'#ddd';
}

    // Can be extended for additional options
}
async function loadUploadOptions(){
    try{
        const [cats,groups,colors]=await Promise.all([
            fetch('/api/categories').then(r=>r.json()),
            fetch('/api/product-groups').then(r=>r.json()),
            fetch('/api/colors').then(r=>r.json())
        ]);
        const catSel=document.getElementById('uploadCategory');
        const grpSel=document.getElementById('uploadGroup');
        const colSel=document.getElementById('uploadColor');
        cats.forEach(c=>{catSel.innerHTML+='<option value="'+c.name+'">'+c.name+'</option>';});
        groups.forEach(g=>{grpSel.innerHTML+='<option value="'+g.name+'">'+g.name+'</option>';});
        colors.forEach(cl=>{colSel.innerHTML+='<option value="'+cl.value+'">'+cl.label+'</option>';});
    }catch(e){console.error('Failed to load upload options')}
}
async function uploadExcel(){
    if(!selectedExcelFile){
        showT('Please select an Excel file first','error');
        return;
    }
    const uploadType=document.querySelector('input[name="uploadType"]:checked').value;
    const dupHandle=document.querySelector('input[name="dupHandle"]:checked').value;
    const formData=new FormData();
    formData.append('file',selectedExcelFile);
    formData.append('upload_type',uploadType);
    formData.append('skip_duplicates',dupHandle==='skip'?'true':'false');
    formData.append('merge_duplicates',dupHandle==='merge'?'true':'false');
    formData.append('category',document.getElementById('uploadCategory').value);
    formData.append('product_group',document.getElementById('uploadGroup').value);
    formData.append('default_quantity',document.getElementById('uploadQuantity').value);
    formData.append('default_expiry',document.getElementById('uploadExpiry').value);
    formData.append('color',document.getElementById('uploadColor').value);
    document.getElementById('uploadProgress').style.display='block';
    document.getElementById('uploadBtn').disabled=true;
    try{
        const r=await fetch('/api/upload/excel-products',{method:'POST',body:formData});
        const d=await r.json();
        if(r.ok){
            showT(d.message+' - Inserted: '+d.inserted+', Updated: '+d.updated,'success');
            closeExcelModal();
            loadStats();
        }else{
            showT(d.message||'Upload failed','error');
        }
    }catch(e){
        showT('Upload failed: '+e.message,'error');
    }
    document.getElementById('uploadProgress').style.display='none';
    document.getElementById('uploadBtn').disabled=false;
}
