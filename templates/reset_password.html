<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - POS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-y: auto;
            padding: 20px 10px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .reset-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .reset-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .reset-header i {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .reset-header h2 {
            font-size: 22px;
            font-weight: 600;
        }
        .reset-header p {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .reset-body {
            padding: 30px;
        }
        .reset-body .form-group {
            margin-bottom: 20px;
        }
        .reset-body .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .reset-body .input-wrapper {
            position: relative;
        }
        .reset-body .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }
        .reset-body .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .reset-body .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        .reset-body .info-box {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
        }
        .reset-body .error-msg {
            background: #fee;
            color: #c0392b;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .reset-body .error-msg.show {
            display: block;
        }
        .reset-body .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }
        .reset-body .success-msg.show {
            display: block;
        }
        .reset-body .requirements {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 6px;
            line-height: 1.5;
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-reset:hover { opacity: 0.9; }
        .btn-reset:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .reset-footer a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .reset-footer a:hover { text-decoration: underline; }
        .reset-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .invalid-token {
            background: #fee;
            color: #c0392b;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .invalid-token.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <i class="fas fa-lock-open"></i>
            <h2>Reset Password</h2>
            <p>Create a new password for your account</p>
        </div>
        <div class="reset-body">
            <div class="invalid-token" id="invalidTokenMsg">
                <i class="fas fa-exclamation-triangle"></i>
                Invalid or expired password reset link. Please request a new one.
            </div>
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            <form id="resetForm" onsubmit="return false;">
                <input type="hidden" id="resetToken" value="{{ request.args.get('token', '') }}">
                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
                    </div>
                    <div class="requirements">Minimum 6 characters recommended</div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn-reset" id="resetBtn" onclick="handleResetPassword()">
                    <i class="fas fa-save"></i> Reset Password
                </button>
            </form>
            <div class="reset-footer">
                <a onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const token = document.getElementById('resetToken').value;
            if (!token) {
                showInvalidToken();
            }
        });

        function handleResetPassword() {
            const btn = document.getElementById('resetBtn');
            const token = document.getElementById('resetToken').value.trim();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            if (!token) {
                showInvalidToken();
                return;
            }

            if (!newPass || !confirmPass) {
                errorMsg.textContent = 'Please enter and confirm your new password';
                errorMsg.classList.add('show');
                return;
            }

            if (newPass.length < 6) {
                errorMsg.textContent = 'Password should be at least 6 characters';
                errorMsg.classList.add('show');
                return;
            }

            if (newPass !== confirmPass) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.classList.add('show');
                return;
            }

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="reset-spinner"></span> Resetting...';

            fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, password: newPass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    successMsg.textContent = 'Password reset successful! Redirecting to login...';
                    successMsg.classList.add('show');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.message || 'Failed to reset password';
                    errorMsg.classList.add('show');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
                }
            })
            .catch(err => {
                errorMsg.textContent = 'Failed to reset password. Please try again.';
                errorMsg.classList.add('show');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
            });
        }

        function showInvalidToken() {
            document.getElementById('invalidTokenMsg').classList.add('show');
            document.getElementById('resetForm').style.display = 'none';
        }

        function goBack() {
            window.location.href = '/login';
        }

        document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleResetPassword();
        });
    </script>
</body>
</html>
